<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__copy">© {{ site.author }} {{ 'now' | date: "%Y" }}</p>
    {% if site.email %}
    <p class="site-footer__mail"><a href="mailto:{{ site.email | encode_email }}">{{ site.email }}</a></p>
    {% endif %}
  </div>
</footer>
