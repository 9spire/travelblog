---
layout: default
---

<header class="page-hero">
  <div class="page-hero__inner">
    <h1 class="page-hero__title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="page-hero__deck">{{ page.description }}</p>
    {% endif %}
  </div>
</header>

<section class="page-content">
  <div class="page-content__inner">
    {{ content }}
  </div>
</section>
